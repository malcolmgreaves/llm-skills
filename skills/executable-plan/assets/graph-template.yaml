# graph.yaml — the machine-readable half of an executable plan.
# The plan document (plan.spec) holds one anchored section per task; each node's
# `spec` points at its anchor. See references/graph-schema.md for every field.
# plan.py keeps these comments when it updates the file.
plan:
  title: <plan title>
  spec: <plan document, .md or .html, relative to this file>
  integration_branch: main
  worktree_root: ../<repo>-lanes/worktrees   # lanes at <root>/<id>; relative = from this file
  scratch_root: ../<repo>-lanes/scratch      # per-lane scratch; plan.py clean reclaims it
  branch_prefix: lane/
  lane_cap: 3            # the machine sets this: one full build per lane
  autonomy: 2            # 0 full control … 4 autonomous; the user names it, and `plan.py approve` records it
  commit_policy: keep    # keep | squash
  coordinator: full      # full | merge | delegate: how much the coordinator reviews
  file_overlap: 2        # the most open lanes that can share one file; off (or 0) never shares
  dependency_overlap: off   # off | interfaces | all: may a task start before its dependencies land?
  workflow:              # the user picks these at draft time
    S: [implement, review]
    M: [implement, review, second_review]
    L: [implement, review, second_review]   # add `fix` to end M or L with a fix stage
  models:                # the user picks a model for every stage the workflows use
    implement: <model id>
    review: <model id>
    second_review: <model id>
    resolve: <model id, mid-tier>              # needed when file_overlap > 1 or dependency_overlap is on
    resolution_review: <model id, mid-tier>
    # fix: <model id>
    # delegate: <model id>
  effort:                # requested effort per stage: low | medium | high | xhigh | max
    implement: <level>
    review: <level>
    second_review: <level>
  # stage_minutes: {implement: 3, review: 3.5, second_review: 3}   # used until timings are measured
  commands:
    build: <command>
    test: <command>
    lint: <command>
    check: <command>
    run: <command>
  gates:                 # run in order, one at a time, in the lane and again at integration
    - <format check>
    - <type check>
    - <lint>
    - <tests>
  guidelines:            # files every agent reads first
    - <path>
  prior_plans:           # plans the tasks cite
    - <path>
  notes: >-
    <machine limits, disk rules, anything that does not fit a field>
nodes:
  - id: <short-id>       # also the anchor, the branch suffix, and the worktree name; quote an all-digit id
    title: <one line>
    spec: "#<short-id>"  # or "<other document>#<anchor>"
    kind: code           # code | docs | plan | measurement
    # escalate: security # one size up: untrusted-input | persistence | security | concurrency | breaking-interface
    # chain: none        # the coordinator does it itself (a seam, a plan edit)
    size: M              # S | M | L
    deps: []             # hard: lands after these (and starts after them unless dependency_overlap allows)
    # interface_deps: [] # deps whose spec fixes the interface this task uses (for dependency_overlap: interfaces)
    soft_deps: []        # preferred order
    files:               # the files it is expected to change (a scheduling hint), tests included
      - <path>
    # alone: true        # runs with no other lane open (the default for kind: measurement)
    owner_decisions: []  # [{question: ..., default: ..., answer: ""}]
    status: planned      # planned | running | review | waiting | conflicted | integrating | done | blocked | skipped
