# graph.yaml — the machine-readable half of an executable plan.
# The plan document (plan.spec) holds one anchored section per task; each node's
# `spec` points at its anchor. See references/graph-schema.md for every field.
# plan.py keeps these comments when it updates the file.
plan:
  title: <plan title>
  spec: <plan document, .md or .html, relative to this file>
  integration_branch: main
  worktree_root: ~/.local/state/git/worktrees/<repo>/lane   # lanes at <root>/<id>; relative = from this file
  scratch_root: /path/with/room/lanes                        # reports and patches at <root>/<id>
  branch_prefix: lane/
  lane_cap: 3            # the machine sets this: one full build per lane
  autonomy: 2            # 0 full control … 2 default (P1s, decisions, destructive) … 4 autonomous
  commit_policy: keep    # keep | squash
  models:                # a cheaper model builds; the strongest one reviews
    implement: <model id, e.g. sonnet>
    review: <model id, e.g. opus>
    fix: <model id, e.g. sonnet>
    final_review: <model id, e.g. opus>
  effort:
    final_review: high
  # stage_minutes: {implement: 3, review: 4.5, fix: 3.5, final_review: 1.5}   # S-task minutes for `waves`
  commands:
    build: <command>
    test: <command>
    lint: <command>
    check: <command>
    run: <command>
  gates:                 # run in order, one at a time, in the lane and again at integration
    - <format check>
    - <type check>
    - <lint>
    - <tests>
  guidelines:            # files every agent reads first
    - <path>
  prior_plans:           # plans the tasks cite
    - <path>
  notes: >-
    <machine limits, disk rules, anything that does not fit a field>
nodes:
  - id: <short-id>       # also the anchor, the branch suffix, and the worktree name; quote an all-digit id
    title: <one line>
    spec: "#<short-id>"  # or "<other document>#<anchor>"
    kind: code           # code | docs | plan | measurement
    # chain: default     # override: default | light | docs-only | none (S code runs light, M/L default)
    size: M              # S | M | L
    deps: []             # hard: must be done first
    soft_deps: []        # preferred order
    files:               # every existing file the task changes, tests included
      - <path>
    # alone: true        # runs with no other lane open (the default for kind: measurement)
    owner_decisions: []  # [{question: ..., default: ..., answer: ""}]
    status: planned      # planned | running | review | integrating | done | blocked | skipped
